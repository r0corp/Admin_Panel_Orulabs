<!doctype html>
<!-- File ini hasil build dari src/pages/lock-screen.html. Edit sumbernya lalu jalankan: python tools/build.py -->
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lock Screen · Orulabs Admin</title>
    <meta name="description" content="Orulabs Admin Panel - template dashboard admin berbasis Bootstrap 5.">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

    <!-- Tema dipasang paling awal supaya tidak berkedip -->
    <script src="assets/js/orulabs-theme-init.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/orulabs.css">
</head>
<body>
<div class="ol-auth-glass flex-column">
        <span class="ol-blob b1"></span>
        <span class="ol-blob b2"></span>

        <div class="text-center mb-5 position-relative">
            <div class="ol-lock-clock" data-ol-bigclock>--:--</div>
            <div class="opacity-75 mt-2" data-ol-bigdate></div>
        </div>

        <div class="ol-glass-card text-center" style="max-width:360px">
            <span class="ol-avatar ol-lock-avatar">AD</span>
            <h1 class="h5 fw-bold mt-3 mb-0">Admin Orulabs</h1>
            <p class="small opacity-75 mb-4">Sesi dikunci. Masukkan password untuk melanjutkan.</p>
            <form class="needs-validation" novalidate data-ol-redirect="index.html">
                <div class="input-group">
                    <input type="password" class="form-control" placeholder="Password" aria-label="Password" required autocomplete="current-password">
                    <button type="submit" class="btn btn-light" aria-label="Buka"><i class="bi bi-arrow-right"></i></button>
                </div>
            </form>
            <p class="small mt-4 mb-0"><a href="login.html">Bukan Anda? Masuk dengan akun lain</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/orulabs.js"></script>
</body>
</html>
