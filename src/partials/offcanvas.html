    <!-- ======================================================
         PANEL TEMA (CUSTOMIZER)
    ======================================================= -->
    <div class="offcanvas offcanvas-end ol-customizer" tabindex="-1" id="olCustomizer" aria-labelledby="olCustomizerLabel">
        <div class="offcanvas-header border-bottom">
            <div>
                <h5 class="offcanvas-title fw-bold" id="olCustomizerLabel"><i class="bi bi-palette me-1 text-primary"></i> Pengaturan Tema</h5>
                <div class="small text-muted-ol">Tersimpan otomatis di browser ini</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Tutup"></button>
        </div>
        <div class="offcanvas-body pt-0">
            <h6>Warna utama</h6>
            <div class="ol-swatches" data-ol-swatches></div>

            <h6>Warna bebas</h6>
            <div class="row g-2">
                <div class="col-5"><input type="color" class="ol-color-input" data-ol-color-input value="#2563eb" aria-label="Pilih warna"></div>
                <div class="col-7"><input type="text" class="form-control h-100" data-ol-hex-input placeholder="#2563eb" aria-label="Kode warna hex"></div>
            </div>

            <h6>Mode</h6>
            <div class="ol-option-group">
                <button type="button" class="ol-option" data-ol-set="mode" data-value="light"><i class="bi bi-sun"></i>Terang</button>
                <button type="button" class="ol-option" data-ol-set="mode" data-value="dark"><i class="bi bi-moon-stars"></i>Gelap</button>
                <button type="button" class="ol-option" data-ol-set="mode" data-value="auto"><i class="bi bi-circle-half"></i>Otomatis</button>
            </div>

            <h6>Gaya sidebar</h6>
            <div class="ol-option-group">
                <button type="button" class="ol-option" data-ol-set="sidebar" data-value="light"><i class="bi bi-layout-sidebar"></i>Terang</button>
                <button type="button" class="ol-option" data-ol-set="sidebar" data-value="dark"><i class="bi bi-layout-sidebar-inset"></i>Gelap</button>
                <button type="button" class="ol-option" data-ol-set="sidebar" data-value="primary"><i class="bi bi-layout-sidebar-inset-reverse"></i>Berwarna</button>
            </div>

            <h6>Sudut kartu</h6>
            <div class="ol-option-group">
                <button type="button" class="ol-option" data-ol-set="radius" data-value="6"><i class="bi bi-square"></i>Tegas</button>
                <button type="button" class="ol-option" data-ol-set="radius" data-value="14"><i class="bi bi-app"></i>Standar</button>
                <button type="button" class="ol-option" data-ol-set="radius" data-value="20"><i class="bi bi-circle"></i>Bulat</button>
            </div>

            <h6>Sidebar desktop</h6>
            <div class="ol-option-group" style="grid-template-columns:1fr 1fr">
                <button type="button" class="ol-option" data-ol-set="mini" data-value="false"><i class="bi bi-arrows-expand-vertical"></i>Lebar</button>
                <button type="button" class="ol-option" data-ol-set="mini" data-value="true"><i class="bi bi-arrows-collapse-vertical"></i>Mini (ikon)</button>
            </div>

            <button type="button" class="btn btn-outline-secondary w-100 mt-4" data-ol-reset-theme>
                <i class="bi bi-arrow-counterclockwise me-1"></i> Kembalikan ke bawaan
            </button>
        </div>
    </div>

    <!-- ======================================================
         STICKY NOTES
    ======================================================= -->
    <div class="offcanvas offcanvas-end ol-notes-panel" tabindex="-1" id="olNotes" aria-labelledby="olNotesLabel">
        <div class="offcanvas-header border-bottom">
            <div>
                <h5 class="offcanvas-title fw-bold" id="olNotesLabel"><i class="bi bi-sticky me-1 text-warning"></i> Sticky Notes</h5>
                <div class="small text-muted-ol">Catatan pribadi, tersimpan di browser</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Tutup"></button>
        </div>
        <div class="offcanvas-body">
            <form class="mb-3" data-ol-notes-form>
                <textarea class="form-control mb-2" rows="3" placeholder="Tulis catatan... (Ctrl+Enter untuk simpan)" aria-label="Catatan baru"></textarea>
                <div class="d-flex align-items-center gap-1">
                    <button type="button" class="ol-note-swatch ol-note-yellow is-active" data-new-note-color="yellow" aria-label="Kuning"></button>
                    <button type="button" class="ol-note-swatch ol-note-green" data-new-note-color="green" aria-label="Hijau"></button>
                    <button type="button" class="ol-note-swatch ol-note-blue" data-new-note-color="blue" aria-label="Biru"></button>
                    <button type="button" class="ol-note-swatch ol-note-pink" data-new-note-color="pink" aria-label="Pink"></button>
                    <button type="button" class="ol-note-swatch ol-note-purple" data-new-note-color="purple" aria-label="Ungu"></button>
                    <button type="button" class="ol-note-swatch ol-note-orange" data-new-note-color="orange" aria-label="Oranye"></button>
                    <button type="submit" class="btn btn-primary btn-sm ms-auto"><i class="bi bi-plus-lg"></i> Tambah</button>
                </div>
            </form>
            <input type="search" class="form-control form-control-sm mb-3" placeholder="Cari catatan..." data-ol-notes-search aria-label="Cari catatan">
            <div data-ol-notes-list></div>
        </div>
    </div>

    <button type="button" class="ol-customizer-toggle" data-bs-toggle="offcanvas" data-bs-target="#olCustomizer" aria-label="Pengaturan tema">
        <i class="bi bi-gear"></i>
    </button>
