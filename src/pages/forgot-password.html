<!--@
title: Lupa Password
layout: auth
-->
    <button type="button" class="ol-navbar-btn ol-auth-mode" data-ol-toggle-mode aria-label="Ganti mode terang/gelap"><i class="bi bi-moon-stars"></i></button>

    <div class="ol-auth-centered">
        <div class="card">
            <div class="card-body">
                <!-- Langkah 1: email -->
                <div id="fpStep1">
                    <div class="text-center mb-4">
                        <span class="ol-stat-icon mb-3" style="width:64px;height:64px;font-size:1.7rem;border-radius:50%"><i class="bi bi-key"></i></span>
                        <h1 class="ol-auth-title">Lupa password?</h1>
                        <p class="text-muted-ol mb-0">Masukkan email Anda, kami kirimkan kode verifikasi.</p>
                    </div>
                    <form onsubmit="event.preventDefault(); if (this.checkValidity()) { document.getElementById('fpStep1').hidden = true; document.getElementById('fpStep2').hidden = false; document.querySelector('[data-ol-otp] input').focus(); } else { this.classList.add('was-validated'); }" novalidate>
                        <div class="mb-3"><label class="form-label" for="fpEmail">Email</label><input type="email" class="form-control" id="fpEmail" required autocomplete="email"><div class="invalid-feedback">Masukkan email yang valid.</div></div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Kirim kode</button>
                    </form>
                </div>

                <!-- Langkah 2: OTP -->
                <div id="fpStep2" hidden>
                    <div class="text-center mb-4">
                        <span class="ol-stat-icon is-success mb-3" style="width:64px;height:64px;font-size:1.7rem;border-radius:50%"><i class="bi bi-envelope-check"></i></span>
                        <h1 class="ol-auth-title">Cek email Anda</h1>
                        <p class="text-muted-ol mb-0">Masukkan 6 digit kode yang kami kirim.</p>
                    </div>
                    <div class="ol-otp mb-4" data-ol-otp>
                        <input type="text" inputmode="numeric" class="form-control" maxlength="1" aria-label="Digit 1">
                        <input type="text" inputmode="numeric" class="form-control" maxlength="1" aria-label="Digit 2">
                        <input type="text" inputmode="numeric" class="form-control" maxlength="1" aria-label="Digit 3">
                        <input type="text" inputmode="numeric" class="form-control" maxlength="1" aria-label="Digit 4">
                        <input type="text" inputmode="numeric" class="form-control" maxlength="1" aria-label="Digit 5">
                        <input type="text" inputmode="numeric" class="form-control" maxlength="1" aria-label="Digit 6">
                    </div>
                    <button type="button" class="btn btn-primary w-100 py-2" data-ol-toast="Kode terverifikasi. Silakan buat password baru." data-variant="success">Verifikasi</button>
                    <p class="text-center small text-muted-ol mt-3 mb-0">Tidak menerima kode? <a href="#" class="fw-semibold text-decoration-none" data-ol-toast="Kode baru dikirim." data-variant="info">Kirim ulang</a></p>
                </div>

                <p class="text-center small mt-4 mb-0"><a href="login.html" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Kembali ke login</a></p>
            </div>
        </div>
    </div>
