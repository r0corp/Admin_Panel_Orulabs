<!--@
title: Login (Glass)
layout: auth
-->
    <!-- Variasi 3: glassmorphism di atas gradient warna tema -->
    <div class="ol-auth-glass">
        <span class="ol-blob b1"></span>
        <span class="ol-blob b2"></span>
        <span class="ol-blob b3"></span>

        <div class="ol-glass-card">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <a href="index.html" class="ol-auth-brand text-white"><img src="assets/img/brand/orulabs-logo-white.png" alt="Orulabs" class="ol-logo-full" style="height:26px"></a>
                <span class="badge rounded-pill" style="background:rgba(255,255,255,.2)">v1.0</span>
            </div>

            <h1 class="ol-auth-title">Halo lagi!</h1>
            <p class="opacity-75 mb-4">Masuk untuk melihat ringkasan hari ini.</p>

            <form class="needs-validation" novalidate data-ol-redirect="index.html">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" placeholder="Username atau email" aria-label="Username atau email" required autocomplete="username">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="gPass" placeholder="Password" aria-label="Password" required autocomplete="current-password">
                    <button class="btn btn-glass" type="button" data-ol-toggle-password="#gPass" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="gRemember"><label class="form-check-label" for="gRemember">Ingat saya</label></div>
                    <a href="forgot-password.html" class="text-decoration-none">Lupa password?</a>
                </div>
                <button type="submit" class="btn btn-light w-100 py-2">Masuk <i class="bi bi-arrow-right ms-1"></i></button>
            </form>

            <div class="ol-divider">atau</div>
            <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-glass btn-icon btn-lg" aria-label="Masuk dengan Google"><i class="bi bi-google"></i></button>
                <button type="button" class="btn btn-glass btn-icon btn-lg" aria-label="Masuk dengan Microsoft"><i class="bi bi-microsoft"></i></button>
                <button type="button" class="btn btn-glass btn-icon btn-lg" aria-label="Masuk dengan GitHub"><i class="bi bi-github"></i></button>
                <button type="button" class="btn btn-glass btn-icon btn-lg" aria-label="Masuk dengan Apple"><i class="bi bi-apple"></i></button>
            </div>
            <p class="text-center small mt-4 mb-0 opacity-75">Belum punya akun? <a href="register.html" class="fw-semibold">Daftar</a></p>
        </div>
    </div>
